name: Chordic validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  language-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run v0.0 validation tests
        run: python -m unittest discover -s tests -v
